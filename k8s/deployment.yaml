apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-resolver
  labels:
    app: entity-resolver
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: entity-resolver
  template:
    metadata:
      labels:
        app: entity-resolver
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: entity-resolver
          image: ghcr.io/agentix-e/entity-resolver:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: entity-resolver-config
            - secretRef:
                name: entity-resolver-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
