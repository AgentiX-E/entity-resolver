apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: entity-resolver
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - er.example.com
      secretName: entity-resolver-tls
  rules:
    - host: er.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: entity-resolver
                port:
                  number: 80
