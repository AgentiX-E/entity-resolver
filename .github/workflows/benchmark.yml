name: Benchmark

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scale:
        description: 'Scale: 100K, 500K, 1M'
        default: '500K'

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run ER benchmark
        id: bench
        run: |
          SCALE="${{ inputs.scale || '500K' }}"
          echo "Scale: $SCALE"
          mkdir -p benchmarks/output
          node benchmarks/staged.mjs

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: pip install pandas splink

      - name: Run unified benchmark suite (I31)
        run: node --import tsx benchmarks/run.ts
        env:
          NODE_OPTIONS: --max-old-space-size=7168

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-report
          path: |
            benchmarks/output/benchmark-report.json
            benchmarks/output/benchmark-report.html
            benchmarks/output/benchmark-matrix.csv
          retention-days: 7
