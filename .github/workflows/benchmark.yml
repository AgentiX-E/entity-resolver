name: Benchmark & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      scale:
        description: 'Scale: 100K, 500K, 1M'
        default: '500K'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: benchmark-pages
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run ER benchmark
        id: bench
        run: |
          SCALE="${{ inputs.scale || '500K' }}"
          echo "Scale: $SCALE"
          mkdir -p benchmarks/output
          node benchmarks/staged.mjs

      - name: Generate HTML report
        run: node benchmarks/report.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: benchmarks/output

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5
