name: CI — Build, Test, Benchmark

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # Required for auto-commit of WASM binary

jobs:
  # Test (JS only, no WASM needed)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Core tests
        run: cd packages/entity-resolver-core && pnpm vitest run --reporter=dot

  # WASM build + ensemble benchmark
  wasm-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM ensemble scorer
        run: |
          cd packages/entity-resolver-core/src/matching/scorers/wasm/rust-scorer
          wasm-pack build --target bundler --out-dir ../scorers --release
      - name: Commit WASM artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/entity-resolver-core/src/matching/scorers/wasm/scorers/
          git diff --staged --quiet || (git commit -m "build(wasm): CI auto-build ensemble scorer binary" && git push)
      - name: Verify WASM exports
        run: |
          node -e "
          const wasm = require('./packages/entity-resolver-core/src/matching/scorers/wasm/scorers/wasm_scorer.js');
          console.log('WASM ensemble export:', typeof wasm.wasm_score);
          "

  # Rust native tests
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust ensemble scorer
        run: cd packages/entity-resolver-native && cargo test
      - name: Build Rust release
        run: cd packages/entity-resolver-native && cargo build --release
