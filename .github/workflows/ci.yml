name: CI — Build, Test, Benchmark

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - run: pnpm install
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Core tests
        run: cd packages/entity-resolver-core && pnpm vitest run --reporter=dot

  wasm-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: 'pnpm' }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - name: Install wasm-pack
        run: npm install -g wasm-pack
      - name: Build WASM ensemble scorer
        run: |
          cd packages/entity-resolver-core/src/matching/scorers/wasm/rust-scorer
          wasm-pack build --target bundler --out-dir ../scorers --release
      - name: Commit WASM artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/entity-resolver-core/src/matching/scorers/wasm/scorers/
          git diff --staged --quiet || (git commit -m "build(wasm): CI auto-build ensemble scorer binary" && git push)

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Rust ensemble scorer
        run: cd packages/entity-resolver-native && cargo test
      - name: Build Rust release
        run: cd packages/entity-resolver-native && cargo build --release
